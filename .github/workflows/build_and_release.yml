name: Test pull request and publish

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
  schedule:
    # run every week (for --pre release tests)
    - cron: "0 0 * * 0"

# cancel in-progress runs that use the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx run check-manifest

  test:
    name: ${{ matrix.platform }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.platform }}
    env:
      UV_PRERELEASE: ${{ github.event_name == 'schedule' && 'allow' || 'if-necessary-or-explicit' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --no-dev --group test

      - name: 🧪 Run Tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      # If something goes wrong with --pre tests, we can open an issue in the repo
      - name: 📝 Report --pre Failures
        if: failure() && github.event_name == 'schedule'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python-version }}
          RUN_ID: ${{ github.run_id }}
          TITLE: "[test-bot] pip install --pre is failing"
        with:
          filename: .github/TEST_FAIL_TEMPLATE.md
          update_existing: true

      - name: Coverage
        uses: codecov/codecov-action@v5

  build-and-inspect-package:
    name: Build & inspect package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and inspect package
        uses: hynek/build-and-inspect-python-package@v2

  build_assets:
    name: Build assets for release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick icnsutils
          pip install uv

      - name: Generate logos and montages
        run: |
          uv run ./tools/generate_logos.py -p -i --montage

      - name: Upload logo pngs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-png
          path: |
            ./logo/generated/*.png
            !./logo/generated/montage.png

      - name: Upload logo svgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-svg
          path: |
            ./logo/generated/*.svg

      - name: Upload montage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: montage
          path: ./logo/generated/montage.png

      - name: Upload icons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons
          path: |
            ./logo/generated/*-plain-*.png
            ./logo/generated/*.ico
            ./logo/generated/*.icns

  upload-to-pypi:
    name: Upload package to PyPI
    needs: build-and-inspect-package
    if: success() && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@v5
        with:
          name: Packages
          path: dist

      - name: 🚢 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub release
    needs:
      - build_assets
      - upload-to-pypi
    if: success() && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v5
        with:
          name: Packages
          path: dist

      - name: Download logo PNGs
        uses: actions/download-artifact@v5
        with:
          name: logos-png
          path: artifacts/logos-png

      - name: Download logo SVGs
        uses: actions/download-artifact@v5
        with:
          name: logos-svg
          path: artifacts/logos-svg

      - name: Download icons
        uses: actions/download-artifact@v5
        with:
          name: icons
          path: artifacts/icons

      - name: Download montage
        uses: actions/download-artifact@v5
        with:
          name: montage
          path: artifacts/montage

      - name: Archive logo assets
        run: |
          tar vczf logos-svg.tar.gz ./artifacts/logos-svg
          tar vczf logos-png.tar.gz ./artifacts/logos-png
          tar vczf icons.tar.gz ./artifacts/icons
          cp ./artifacts/montage/montage.png .

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Logos

            ![Logos montage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/montage.png)
          files: |
            ./dist/*
            logos-svg.tar.gz
            logos-png.tar.gz
            icons.tar.gz
            montage.png
