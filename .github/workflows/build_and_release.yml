name: Generate Logos

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick icnsutils
          pip install uv
      - name: Generate logos and montages
        run: |
          uv run ./tools/generate_logos.py -p -i --montage
      - name: Upload logo pngs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-png
          path: |
            ./logo/generated/*.png
            !./logo/generated/montage.png
      - name: Upload logo svgs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logos-svg
          path: |
            ./logo/generated/*.svg
      - name: Upload montage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: montage
          path: ./logo/generated/montage.png
      - name: Upload icons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons
          path: |
            ./logo/generated/*-plain-*.png
            ./logo/generated/*.ico
            ./logo/generated/*.icns

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Archive artifacts
        run: |
          tar vczf logos-svg.tar.gz ./artifacts/logos-svg
          tar vczf logos-png.tar.gz ./artifacts/logos-png
          tar vczf icons.tar.gz ./artifacts/icons
          cp ./artifacts/montage/montage.png .
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Logos
            ![Logos montage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/montage.png)
          files: |
            logos-svg.tar.gz
            logos-png.tar.gz
            icons.tar.gz
            montage.png
